name: Application CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - "scanner/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "scanner/**"

env:
  AWS_REGION: us-east-1

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pytest pytest-cov
      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "./scanner"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  deploy:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && vars.AWS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Package and deploy Lambda
        run: |
          cd scanner
          zip -j /tmp/scanner.zip handler.py
          FUNC_NAME="logsentry-scanner-${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}"
          aws lambda update-function-code \
            --function-name $FUNC_NAME \
            --zip-file fileb:///tmp/scanner.zip
