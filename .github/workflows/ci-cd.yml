name: Application CI/CD Pipeline

on:
  push:
    branches: [main, dev]
    paths:
      - "scanner/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "scanner/**"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: logsentry-scanner-dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "./scanner"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && vars.AWS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          docker build -t $ECR_URI:${{ github.sha }} -t $ECR_URI:latest ./scanner
          docker push $ECR_URI:${{ github.sha }}
          docker push $ECR_URI:latest
      - name: Update Lambda function
        if: github.ref == 'refs/heads/dev'
        run: |
          ECR_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          aws lambda update-function-code \
            --function-name logsentry-scanner-dev \
            --image-uri $ECR_URI:${{ github.sha }}
